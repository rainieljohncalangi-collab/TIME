<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth Callback</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 420px; }
        .card h1 { margin-bottom: 16px; font-size: 24px; color: #333; }
        .card p { margin-bottom: 18px; color: #555; }
        .card button { padding: 12px 20px; border: none; border-radius: 8px; background: maroon; color: white; cursor: pointer; font-size: 16px; }
        .card button:hover { background: #600000; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Google Login Complete</h1>
        <p id="message">Finishing sign in…</p>
        <button id="continueBtn" style="display:none;">Continue to Dashboard</button>
    </div>

    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        const username = getQueryParam('username');
        const email = getQueryParam('email');
        const role = getQueryParam('role');
        const profilePic = getQueryParam('profilePic');
        const messageEl = document.getElementById('message');
        const continueBtn = document.getElementById('continueBtn');

        if (!username || !email) {
            messageEl.innerText = 'Google login failed. No user data returned.';
        } else {
            const userData = { username, email, role, profilePic };
            localStorage.setItem('currentScanCheckUser', JSON.stringify(userData));
            messageEl.innerText = `Welcome ${username}! Your Google login is complete.`;
            continueBtn.style.display = 'inline-flex';
        }

        continueBtn.addEventListener('click', () => {
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
